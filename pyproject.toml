[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consensus"
version = "1.0.0"
description = "A moderated discussion platform for humans and AI"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0",
    "PyGObject>=3.42; sys_platform == 'linux'",
    "pycairo>=1.24; sys_platform == 'linux'",
]
web = ["aiohttp>=3.9"]
tools = ["trafilatura>=1.6"]
memory = ["sqlite-vec>=0.1.0", "numpy>=1.26"]
documents = ["sqlite-vec>=0.1.0", "numpy>=1.26", "pdfplumber>=0.10"]
images = ["Pillow>=10.0"]
all = [
    "pywebview>=5.0",
    "PyGObject>=3.42; sys_platform == 'linux'",
    "pycairo>=1.24; sys_platform == 'linux'",
    "aiohttp>=3.9",
    "trafilatura>=1.6",
    "sqlite-vec>=0.1.0",
    "numpy>=1.26",
    "pdfplumber>=0.10",
    "Pillow>=10.0",
]

[project.scripts]
consensus = "consensus.__main__:main"
consensus-mcp = "consensus.mcp_server:main"

[tool.setuptools.packages.find]
include = ["consensus*", "evaluation*"]

[tool.setuptools.package-data]
consensus = ["static/*", "migrations/*.sql"]
evaluation = ["static/*", "migrations/*.sql"]
